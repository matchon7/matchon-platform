name: MATCHON 플랫폼 배포

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build MATCHON
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: matchon-platform-complete/package-lock.json

      - name: Install dependencies
        working-directory: ./matchon-platform-complete
        run: npm ci

      - name: Prepare CNAME
        working-directory: ./matchon-platform-complete
        run: |
          mkdir -p public
          cp CNAME public/CNAME

      - name: Build Vite
        working-directory: ./matchon-platform-complete
        run: npm run build

      - name: Verify build output
        working-directory: ./matchon-platform-complete
        run: |
          test -f dist/index.html
          test -f dist/CNAME
          echo "MATCHON build verification completed."

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./matchon-platform-complete/dist

  deploy:
    name: Deploy MATCHON to GitHub Pages

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
