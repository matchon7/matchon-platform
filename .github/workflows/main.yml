name: MATCHON 플랫폼 배포

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: MATCHON을 빌드하세요
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./matchon-platform-complete

    steps:
      # 1. 저장소 가져오기
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      # 2. Node.js 설정
      # 중요: npm 캐시는 일단 사용하지 않습니다.
      # 현재 실패 원인이 캐시 경로이기 때문입니다.
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 3. 프로젝트 구조 확인
      - name: 프로젝트 구조 확인
        run: |
          echo "현재 위치:"
          pwd
          echo ""
          echo "프로젝트 파일:"
          ls -la
          echo ""
          echo "src:"
          ls -la src || true
          echo ""
          echo "public:"
          ls -la public || true

      # 4. npm 의존성 설치
      # package-lock.json이 현재 없는 경우를 고려하여 npm install 사용
      - name: 의존성 설치
        run: npm install

      # 5. Vite 빌드
      - name: Vite 빌드
        run: npm run build

      # 6. CNAME 처리
      # 프로젝트 루트에 CNAME이 있다면 dist로 복사합니다.
      - name: CNAME 복사
        run: |
          if [ -f "CNAME" ]; then
            cp CNAME dist/CNAME
            echo "CNAME 복사 완료"
          else
            echo "CNAME 파일 없음 - 계속 진행"
          fi

      # 7. 빌드 결과 확인
      - name: 빌드 결과 확인
        run: |
          echo "===== DIST ====="
          ls -la dist
          echo ""
          echo "===== DIST 파일 ====="
          find dist -maxdepth 2 -type f | sort

      # 8. GitHub Pages 설정
      - name: GitHub Pages 설정
        uses: actions/configure-pages@v5

      # 9. Pages 업로드
      - name: GitHub Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./matchon-platform-complete/dist

  deploy:
    name: MATCHON을 GitHub Pages에 배포하세요
    runs-on: ubuntu-latest

    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: MATCHON 배포
        id: deployment
        uses: actions/deploy-pages@v4
